    <script>
      // Thème posé avant le rendu pour éviter tout flash : choix mémorisé, sinon réglage du système.
      (function () {
        var t;
        try { t = localStorage.getItem("bdy-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f7f5f0");
      })();
    </script>
